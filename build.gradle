plugins {
 id 'com.android.application' version '8.7.3' apply false
 id 'com.android.library' version '8.7.3' apply false
 id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}

// Applies to direct Gradle calls as well as build_apk.sh, including watch-only releases.
gradle.projectsEvaluated {
 subprojects.findAll { it.name in ['app', 'watch', 'watchface'] }.each { module ->
  module.tasks.matching { it.name in ['packageRelease', 'assembleRelease'] }.configureEach {
   dependsOn ':app:validateRecognitionRelease'
  }
 }
}
