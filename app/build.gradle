plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'org.tangowiz.app'
 compileSdk 35
 defaultConfig {
  applicationId 'org.tangowiz.app'
  minSdk 26
  targetSdk 35
  versionCode 22
  versionName '0.5.10'
  testInstrumentationRunner 'org.tangowiz.app.RecognitionInstrumentation'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
  externalNativeBuild { cmake { cppFlags '-std=c++17 -O3 -fno-fast-math -ffp-contract=off' } }
 }
 ndkVersion '27.0.12077973'
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
 androidResources { ignoreAssetsPattern '!catalog.bin:!nmfp.tflite:!catalog.json:!model-provenance.json:!model-download-provenance.json'; noCompress += ['bin','tflite'] }
 packaging { jniLibs { useLegacyPackaging = false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget='17' }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation project(':wear-common')
 implementation 'com.google.android.gms:play-services-wearable:18.2.0'
 implementation('org.tensorflow:tensorflow-lite:2.15.0') { transitive = false }
 implementation('org.tensorflow:tensorflow-lite-api:2.15.0') { transitive = false }
}
